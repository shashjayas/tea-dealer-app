services:

  db:
    image: mysql:8
    container_name: tea-dealer-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./tea-dealer-backend
    container_name: tea-dealer-backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./tea-dealer-frontend
    container_name: tea-dealer-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default
      - proxy

volumes:
  mysql_data:

networks:
  proxy:
    external: true
